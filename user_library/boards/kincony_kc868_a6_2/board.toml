note = "Шина SPI"
functions = [
    "din",
    "dout",
    "pwm",
]

[[pin]]
gpio = 23
name = "SPI MOSI"
note = "Шина SPI"
functions = [
    "din",
    "dout",
    "pwm",
]

[[pin]]
gpio = 25
name = "DA2"
note = "Аналоговый выход DA2 (ЦАП)"
functions = [
    "din",
    "dout",
    "pwm",
    "adc",
    "dac",
]

[[pin]]
gpio = 26
name = "DA1"
note = "Аналоговый выход DA1 (ЦАП)"
functions = [
    "din",
    "dout",
    "pwm",
    "adc",
    "dac",
]

[[pin]]
gpio = 27
name = "RS485 TX"
note = "Передача RS-485"
functions = [
    "din",
    "dout",
    "pwm",
    "adc",
