]

[[pin]]
gpio = 35
name = "A4"
note = "Аналоговый вход A4"
functions = [
    "din",
    "adc",
]

[[pin]]
gpio = 36
name = "A1"
note = "Аналоговый вход A1"
functions = [
    "din",
    "adc",
]

[[pin]]
gpio = 39
name = "A2"
note = "Аналоговый вход A2"
functions = [
    "din",
    "adc",
]

[[expander_pin]]
device = "relays"
pin = 0
name = "Реле1"
functions = ["dout"]

[[expander_pin]]
device = "relays"
pin = 1
name = "Реле2"
functions = ["dout"]

[[device]]
id = "relays"
kind = "pcf8574_out"
name = "Выходы"
description = "Реле K1–K6 на PCF8574 (адрес 0x24, шина I²C: SDA = GPIO4, SCL = GPIO15). Не проверено на железе."
channels = [
    "K1",
    "K2",
    "K3",
    "K4",
    "K5",
    "K6",
]
address = 36
inverted = true
scl = 15
sda = 4

[[device]]
id = "inputs"
kind = "pcf8574_in"
name = "Входы"
description = "Оптоизолированные входы X1–X6 на PCF8574 (адрес 0x22, шина I²C: SDA = GPIO4, SCL = GPIO15). Не проверено на железе."
channels = [
    "X1",
    "X2",
    "X3",
    "X4",
    "X5",
    "X6",
]
address = 34
inverted = true
scl = 15
sda = 4
