[board]
id = "kincony_kc868_a6_2"
name = "Kincony KC868-A6 (копия)"
chip = "esp32"
fqbn = "esp32:esp32:esp32"

[[pin]]
gpio = 0
name = "кнопка"
note = "кнопка на плате"
functions = ["din"]

[[pin]]
gpio = 4
name = "I2C SDA"
note = "Шина I²C расширителей PCF8574 (реле и входы)"
busy = "занят шиной I²C расширителей реле и входов"
functions = [
    "din",
    "dout",
    "pwm",
    "adc",
]

[[pin]]
gpio = 5
name = "SPI CS"
note = "Шина SPI"
functions = [
    "din",
    "dout",
    "pwm",
]

[[pin]]
gpio = 14
name = "RS485 RX"
note = "Приём RS-485"
functions = [
    "din",
    "dout",
    "pwm",
    "adc",
]

[[pin]]
gpio = 15
name = "I2C SCL"
note = "Шина I²C расширителей PCF8574 (реле и входы)"
busy = "занят шиной I²C расширителей реле и входов"
functions = [
    "din",
    "dout",
    "pwm",
    "adc",
]

[[pin]]
