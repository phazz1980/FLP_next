# Насос включается, если давление ниже 2 бар дольше 5 секунд.

# Датчик давления 0…10 бар с выходом на АЦП.
[[block]]
id = "sensor"
type = "analog_in"
pin = 34

# Отсчёт АЦП 0…4095 → бары.
[[block]]
id = "pressure"
type = "scale"
in_max = 4095.0
out_max = 10.0

[[block]]
id = "low"
type = "less"
b = 2.0

[[block]]
id = "delay"
type = "timer_on"
time = "5s"

# Реле насоса.
[[block]]
id = "pump"
type = "digital_out"
pin = 26

[[link]]
from = "sensor.out"
to   = "pressure.in"

[[link]]
from = "pressure.out"
to   = "low.a"

[[link]]
from = "low.out"
to   = "delay.in"

[[link]]
from = "delay.out"
to   = "pump.in"
