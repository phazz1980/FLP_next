# Веб-страница в модуле WASM: страницей занимается мастер. Переключатель на странице включает
# светодиод, ползунок показывается числом, индикатором и графиком, введённое имя возвращается строкой.

[[block]]
id = "wifi"
type = "wifi"
ssid = "MyNetwork"
password = "secret123"

[[block]]
id = "page"
type = "web_ui"
title = "Модуль"
password = "1234"

[[block]]
id = "sw"
type = "web_switch"
caption = "Светодиод"
row = 1
col = 1

[[block]]
id = "level"
type = "web_slider"
caption = "Уровень"
min = 0.0
max = 100.0
initial = 25.0
unit = "%"
row = 3
col = 1

[[block]]
id = "name"
type = "web_text_input"
caption = "Имя"
initial = "CRAB"
row = 5
col = 1

[[block]]
id = "shown"
type = "web_value"
caption = "Уровень"
unit = "%"
decimals = 0
row = 1
col = 13

[[block]]
id = "lamp"
type = "web_led"
caption = "Горит"
row = 3
col = 13

[[block]]
id = "hello"
type = "web_text"
caption = "Привет"
row = 5
col = 13

[[block]]
id = "trend"
type = "web_chart"
caption = "История уровня"
unit = "%"
min = 0.0
max = 100.0
period = 2
points = 30
row = 7
col = 1
w = 24

[[block]]
id = "prefix"
type = "text_const"
value = "Привет, "

[[block]]
id = "join"
type = "text_concat"

[[block]]
id = "led"
type = "digital_out"
pin = 2

[[block]]
id = "head"
type = "web_label"
caption = "Управление"
col = 1
row = 1
w = 24
h = 2

[[block]]
id = "btn"
type = "web_button"
caption = "Нажать"
col = 9
row = 3
w = 8
h = 2

[[block]]
id = "inp"
type = "web_input"
caption = "Уставка"
min = -50.0
max = 150.0
step = 0.5
initial = 21.5
unit = "°C"
col = 17
row = 5
w = 8
h = 2

[[block]]
id = "bar"
type = "web_gauge"
caption = "Шкала"
min = 0.0
max = 100.0
unit = "%"
col = 9
row = 7
w = 16
h = 4

[[block]]
id = "line"
type = "web_shape"
shape = 0
thickness = 2
color = "#4a90d9"
col = 1
row = 13
w = 24
h = 2

[[block]]
id = "tank"
type = "web_tank"
caption = "Ёмкость"
unit = "%"
min = 0.0
max = 100.0
col = 1
row = 33
w = 4
h = 8
color = "#4a90d9"

[[link]]
from = "level.out"
to   = "tank.in"

# A second image of the tank widget: it works with the same widget on the page.
[[block]]
id = "tank_2"
type = "web_tank"
tag = "tank"

[[link]]
from = "level.out"
to   = "tank_2.in"

[[block]]
id = "clock"
type = "web_clock"
caption = "Время"
col = 5
row = 33
w = 8
h = 4

[[block]]
id = "pic"
type = "web_image"
caption = "Схема"
url = "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b0/ESP32_Espressif_ESP-WROOM-32_Wi-Fi_Bluetooth_Module.jpg/320px-ESP32_Espressif_ESP-WROOM-32_Wi-Fi_Bluetooth_Module.jpg"
col = 13
row = 33
w = 8
h = 8

[[block]]
id = "fan"
type = "web_icon"
caption = "Вентилятор"
icon = 1
color = "#2da44e"
col = 21
row = 33
w = 4
h = 6

[[link]]
from = "sw.out"
to   = "fan.in"

[[link]]
from = "sw.out"
to = "led.in"

[[link]]
from = "sw.out"
to = "lamp.in"

[[link]]
from = "level.out"
to = "bar.in"

[[link]]
from = "level.out"
to = "shown.in"

[[link]]
from = "prefix.out"
to = "join.a"

[[link]]
from = "name.out"
to = "join.b"

[[link]]
from = "join.out"
to = "hello.in"

[[link]]
from = "level.out"
to = "trend.in"

[[block]]
id = "netform"
type = "web_net"
caption = "Сеть"
init_ssid = "home"
init_dhcp = true
row = 7
col = 1
w = 12

[[block]]
id = "ssid_shown"
type = "web_text"
caption = "Сеть Wi-Fi"
row = 5
col = 1

[[link]]
from = "netform.ssid"
to = "ssid_shown.in"
