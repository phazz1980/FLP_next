# Самопроверка: блоки получают константы, результаты (тест=значение) раз в секунду печатаются в USB
# Ожидается: abs=3.5 min=2 max=5 lim=100 sqrt=4 sq=9 pow=1024 mod=2 sw=2 mux=30 dms=0/7/0 tt=0/1 deb=gen (через 100 мс после gen)

[[block]]
id = "abs"
type = "abs"
const = { in = -3.5 }

[[block]]
id = "mn"
type = "min"
const = { a = 2.0, b = 5.0 }

[[block]]
id = "mx"
type = "max"
const = { a = 2.0, b = 5.0 }

[[block]]
id = "lim"
type = "limit"
const = { in = 150.0 }
lo = 0.0
hi = 100.0

[[block]]
id = "rt"
type = "sqrt"
const = { in = 16.0 }

[[block]]
id = "sqr"
type = "sq"
const = { in = -3.0 }

[[block]]
id = "pw"
type = "pow"
const = { a = 2.0, b = 10.0 }

[[block]]
id = "md"
type = "mod"
const = { a = 17.0, b = 5.0 }

[[block]]
id = "sw"
type = "switch"
const = { sel = true, a = 1.0, b = 2.0 }

[[block]]
id = "mx4"
type = "mux"
count = 3
const = { sel = 2.0, a = 10.0, b = 20.0, c = 30.0 }

[[block]]
id = "dm"
type = "dms"
count = 3
const = { sel = 1.0, in = 7.0 }

[[block]]
id = "gen"
type = "generator"
time_on = "700ms"
time_off = "700ms"

[[block]]
id = "tog"
type = "t_trigger"

[[block]]
id = "deb"
type = "debounce"
time = "100ms"

[[block]]
id = "tt_n"
type = "switch"
const = { a = 0.0, b = 1.0 }

[[block]]
id = "deb_n"
type = "switch"
const = { a = 0.0, b = 1.0 }

[[block]]
id = "tick"
type = "generator"
time_on = "100ms"
time_off = "900ms"

[[link]]
from = "gen.out"
to   = "tog.in"

[[link]]
from = "gen.out"
to   = "deb.in"

[[link]]
from = "tog.out"
to   = "tt_n.sel"

[[link]]
from = "deb.out"
to   = "deb_n.sel"

