# MQTT через Wi-Fi: flp/temp — температура (по изменению), flp/button — кнопка (по изменению),
# flp/led (1/0, on/off) — включает светодиод.
# Публикации и подписка заданы в панели слева (раздел MQTT); значения идут через переменные,
# привязки лежат в [block.bind].

[[var]]
name = "Температура"
type = "float"

[[var]]
name = "Кнопка"
type = "bool"

[[var]]
name = "Светодиод"
type = "bool"

[[block]]
id = "wifi"
type = "wifi"
ssid = "MyNetwork"

[[block]]
id = "broker"
type = "mqtt"
broker = "broker.hivemq.com"
user = "device"

[[block]]
id = "sensor"
type = "ds18b20"
pin = 4

[[block]]
id = "temp_pub"
type = "mqtt_publish"
topic = "flp/temp"
trigger = 1
deadband = 0.2
decimals = 1

[block.bind]
value = "Температура"

[[block]]
id = "button"
type = "digital_in"
pin = 13
pullup = true
inverted = true

[[block]]
id = "button_pub"
type = "mqtt_publish"
topic = "flp/button"
retain = true
trigger = 1

[block.bind]
value = "Кнопка"

[[block]]
id = "led_sub"
type = "mqtt_subscribe"
topic = "flp/led"
kind = "bool"

[block.bind]
out_b = "Светодиод"

[[block]]
id = "led"
type = "digital_out"
pin = 2

[[block]]
id = "temp_w"
type = "var_set"
var = "Температура"

[[block]]
id = "button_w"
type = "var_set"
var = "Кнопка"

[[block]]
id = "led_r"
type = "var_get"
var = "Светодиод"

[[link]]
from = "sensor.temp"
to   = "temp_w.in"

[[link]]
from = "button.out"
to   = "button_w.in"

[[link]]
from = "led_r.out"
to   = "led.in"
