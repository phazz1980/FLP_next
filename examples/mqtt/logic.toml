[[var]]
name = "Температура"
type = "float"

[[var]]
name = "Кнопка"
type = "bool"

[[var]]
name = "Светодиод"
type = "bool"

[[block]]
id = "wifi"
type = "wifi"
param_in = [
    "net_period",
]
out_error = true
out_ready = true
out_status = true
ssid = "MyNetwork"
wifi_mode = 0

[[block]]
id = "broker"
type = "mqtt"
broker = "broker.hivemq.com"
user = "device"

[[block]]
id = "sensor"
type = "ds18b20"
pin = 4

[[block]]
id = "temp_pub"
type = "mqtt_publish"
deadband = 0.2
decimals = 1
topic = "crab/temp"
trigger = 1

[block.bind]
value = "Температура"

[[block]]
id = "button"
type = "digital_in"
inverted = true
pin = 13
pullup = true

[[block]]
id = "button_pub"
type = "mqtt_publish"
retain = true
topic = "crab/button"
trigger = 1

[block.bind]
value = "Кнопка"

[[block]]
id = "led_sub"
type = "mqtt_subscribe"
kind = "bool"
topic = "crab/led"

[block.bind]
out_b = "Светодиод"

[[block]]
id = "led"
type = "digital_out"
pin = 2

[[block]]
id = "temp_w"
type = "var_set"
var = "Температура"

[[block]]
id = "button_w"
type = "var_set"
var = "Кнопка"

[[block]]
id = "led_r"
type = "var_get"
var = "Светодиод"

[[link]]
from = "sensor.temp"
to = "temp_w.in"

[[link]]
from = "button.out"
to = "button_w.in"

[[link]]
from = "led_r.out"
to = "led.in"

[[link]]
from = "sensor.temp"
to = "temp_pub.value"

[[link]]
from = "button.out"
to = "button_pub.value"
