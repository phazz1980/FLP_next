[[var]]
name = "Сеть"
type = "string"

[[var]]
name = "Пароль"
type = "string"

[[block]]
id = "wifi"
type = "wifi"
ssid = "MyNetwork"
param_in = ["ssid", "password"]

[[block]]
id = "net_r"
type = "var_get"
var = "Сеть"

[[link]]
from = "net_r.out"
to = "wifi.ssid"

[[block]]
id = "pass_r"
type = "var_get"
var = "Пароль"

[[link]]
from = "pass_r.out"
to = "wifi.password"

[[var]]
name = "Брокер"
type = "string"

[[var]]
name = "Логин"
type = "string"

[[block]]
id = "broker"
type = "mqtt"
param_in = ["broker", "user", "password", "client_id"]
port = 1883

[[block]]
id = "broker_r"
type = "var_get"
var = "Брокер"

[[block]]
id = "login_r"
type = "var_get"
var = "Логин"

[[link]]
from = "broker_r.out"
to = "broker.broker"

[[link]]
from = "login_r.out"
to = "broker.user"

[[link]]
from = "login_r.out"
to = "broker.password"

[[link]]
from = "login_r.out"
to = "broker.client_id"

[[block]]
id = "sub"
type = "mqtt_subscribe"
param_in = ["topic"]
kind = "string"

[[link]]
from = "login_r.out"
to = "sub.topic"
