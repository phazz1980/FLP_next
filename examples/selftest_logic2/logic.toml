# Самопроверка логических блоков: блоки получают константы, результаты (имя=значение) раз в секунду уходят в USB.
# Ожидается: cmp=1 sr=1 sin=0.5 cos=0.5 tan=1.0 band=8 bor=14 bxor=6 bnot=-1 bread=1 bwrite=8 b0=1 b1=0 b2=1 tobyte=133
# dec=1 enc=1 any=1 f2i=3 i2f=7 lo=52 hi=18 word=4660 d0=4 d1=3 d2=2 d3=1 dword=16909060 find=6 code=98 ch=b add=abc
# pid=20 and3=1 xor3=1 mux16=99 dms16=5 chg=0 schg=0 bchg=0 rnd=10…20

