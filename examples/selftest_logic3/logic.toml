# Ожидается: poly=60.0 (между точками 50:20 и 100:100 при входе 75), ip=192.168.0.69, ok=1.0 a=10 d=1 bad=0.0

[[block]]
id = "poly"
type = "scale_table"
points = "0:0;50:20;100:100"
const = { in = 75.0 }

[[block]]
id = "poly_text"
type = "num_to_text"
decimals = 1
prefix = "poly="

[[block]]
id = "ip"
type = "ip_to_text"
const = { a = 192, b = 168, c = 0, d = 69 }

[[block]]
id = "ip_back"
type = "text_to_ip"
const = { in = "10.20.30.1" }

[[block]]
id = "ip_bad"
type = "text_to_ip"
const = { in = "10.20.300.1" }

[[block]]
id = "ok_show"
type = "switch"
const = { a = 0.0, b = 1.0 }

[[block]]
id = "bad_show"
type = "switch"
const = { a = 0.0, b = 1.0 }

[[block]]
id = "ok_text"
type = "num_to_text"
decimals = 0
prefix = "ok="

[[block]]
id = "bad_text"
type = "num_to_text"
decimals = 0
prefix = "bad="

[[block]]
id = "d_text"
type = "num_to_text"
decimals = 0
prefix = "d="

[[block]]
id = "line"
type = "text_concat"
count = 5
separator = " "

[[block]]
id = "line2"
type = "text_concat"
count = 2
separator = " "
const = { a = "ip=" }

[[block]]
id = "tick"
type = "generator"
time_on = "100ms"
time_off = "900ms"

[[block]]
id = "tx"
type = "uart_send"
port = -1
trigger = 0

[[block]]
id = "tx2"
type = "uart_send"
port = -1
trigger = 0

[[link]]
from = "poly.out"
to   = "poly_text.in"

[[link]]
from = "ip_back.ok"
to   = "ok_show.sel"

[[link]]
from = "ip_bad.ok"
to   = "bad_show.sel"

[[link]]
from = "ok_show.out"
to   = "ok_text.in"

[[link]]
from = "bad_show.out"
to   = "bad_text.in"

[[link]]
from = "ip_back.d"
to   = "d_text.in"

[[link]]
from = "poly_text.out"
to   = "line.a"

[[link]]
from = "ok_text.out"
to   = "line.b"

[[link]]
from = "bad_text.out"
to   = "line.c"

[[link]]
from = "d_text.out"
to   = "line.d"

[[link]]
from = "ip.out"
to   = "line2.b"

[[link]]
from = "line.out"
to   = "tx.value"

[[link]]
from = "tick.out"
to   = "tx.en"

[[link]]
from = "line2.out"
to   = "tx2.value"

[[link]]
from = "tick.out"
to   = "tx2.en"
