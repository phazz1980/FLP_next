[block]
type = "scale_table"
name = "Нелинейное масштабирование"
symbol = "POLY"
group = "Масштабирование"
description = "Значение по ломаной линии: точки «вход:выход» через точку с запятой, между точками — линейная интерполяция, за краями — крайние значения."

[[input]]
name = "in"
type = "float"

[[output]]
name = "out"
type = "float"

[[param]]
name = "points"
label = "точки"
type = "string"
default = '"0:0;50:20;100:100"'
description = "Пары вход:выход по возрастанию входа, например 0:0;50:20;100:100"
