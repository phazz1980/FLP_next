[block]
type = "decoder"
name = "Дешифратор"
symbol = "DC"
group = "Операции с битами"
description = "Включает выход с номером, равным входу; остальные выключены."

[[input]]
name = "in"
type = "int"

[[output]]
name = "o0"
type = "bool"

