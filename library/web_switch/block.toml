[block]
type = "web_switch"
name = "Веб-переключатель"
symbol = "SW"
group = "Веб-интерфейс"
description = "Переключатель на веб-странице: выход держит состояние, пока его не изменят на странице."
memory = true

[[output]]
name = "out"
type = "bool"

[[param]]
name = "caption"
type = "string"
label = "Подпись"
default = "Веб-переключатель"
description = "Подпись виджета на странице"

[[param]]
name = "initial"
type = "bool"
label = "Начальное"
default = false
description = "Состояние после включения питания"

[[param]]
name = "col"
type = "int"
label = "Колонка"
default = 1
description = "Левая колонка сетки страницы (1–12)"

[[param]]
name = "row"
type = "int"
label = "Строка"
default = 1
description = "Верхняя строка сетки страницы (1, 2, …)"

[[param]]
name = "w"
type = "int"
label = "Ширина"
default = 3
description = "Ширина в колонках сетки (1–12)"

[[param]]
name = "h"
type = "int"
label = "Высота"
default = 1
description = "Высота в строках сетки"
