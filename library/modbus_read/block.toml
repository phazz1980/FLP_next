[block]
type = "modbus_read"
name = "Чтение Modbus"
symbol = "MB ←"
group = "Сеть"
description = "Читает значение из таблицы Modbus TCP Slave (то, что записал мастер)."

[[output]]
name = "out"
type = "int"
when = 'kind == "int"'
description = "Значение регистра"

[[output]]
name = "out_f"
type = "float"
when = 'kind == "float"'
description = "Значение двух регистров как float"

[[output]]
name = "out_b"
type = "bool"
when = 'kind == "bool"'
description = "Состояние бита"

[[param]]
name = "slave"
type = "string"
default = "tcp"
description = "Чьи таблицы: tcp (Modbus TCP Slave) или rtu (Modbus RTU Slave)"

[[param]]
name = "table"
type = "string"
default = "holding"
description = "Таблица: holding, input, coil или discrete"

[[param]]
name = "kind"
type = "string"
default = "int"
description = "Тип значения: int (1 регистр), float (2 регистра) или bool (катушка, вход)"

[[param]]
name = "reg"
type = "int"
default = 0
min = 0
description = "Адрес в таблице"
