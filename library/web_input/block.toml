[block]
type = "web_input"
name = "Веб-ввод числа"
symbol = "NUM"
group = "Веб-интерфейс"
description = "Поле ввода числа на веб-странице (уставка): выход — введённое число. Если min равно max, границ нет."
memory = true

[[output]]
name = "out"
type = "float"

[[param]]
name = "caption"
type = "string"
label = "Подпись"
default = "Веб-ввод числа"
description = "Подпись виджета на странице"

[[param]]
name = "min"
type = "float"
label = "Минимум"
default = 0.0
description = "Нижняя граница"

[[param]]
name = "max"
type = "float"
label = "Максимум"
default = 0.0
description = "Верхняя граница"

[[param]]
name = "step"
type = "float"
label = "Шаг"
default = 1.0
description = "Шаг изменения значения"

[[param]]
name = "initial"
type = "float"
label = "Начальное"
default = 0.0
description = "Значение после включения питания"

[[param]]
name = "unit"
type = "string"
label = "Единица"
default = ""
description = "Единица измерения рядом со значением"

[[param]]
name = "col"
type = "int"
label = "Колонка"
default = 1
description = "Левая колонка сетки страницы (1–12)"

[[param]]
name = "row"
type = "int"
label = "Строка"
default = 1
description = "Верхняя строка сетки страницы (1, 2, …)"

[[param]]
name = "w"
type = "int"
label = "Ширина"
default = 4
description = "Ширина в колонках сетки (1–12)"

[[param]]
name = "h"
type = "int"
label = "Высота"
default = 1
description = "Высота в строках сетки"
