[block]
type = "web_led"
name = "Веб-индикатор"
symbol = "LED"
group = "Веб-интерфейс"
description = "Лампа на веб-странице: горит, пока на входе true."
memory = true

[[input]]
name = "in"
type = "bool"

[[param]]
name = "caption"
type = "string"
label = "Подпись"
default = "Веб-индикатор"
description = "Подпись виджета на странице"

[[param]]
name = "col"
show = "hidden"
type = "int"
label = "Колонка"
default = 1
description = "Левая колонка сетки страницы (1–12)"

[[param]]
name = "row"
show = "hidden"
type = "int"
label = "Строка"
default = 1
description = "Верхняя строка сетки страницы (1, 2, …)"

[[param]]
name = "w"
show = "hidden"
type = "int"
label = "Ширина"
default = 3
description = "Ширина в колонках сетки (1–12)"

[[param]]
name = "h"
show = "hidden"
type = "int"
label = "Высота"
default = 1
description = "Высота в строках сетки"

[[param]]
name = "page"
show = "hidden"
type = "int"
label = "Страница"
default = 1
description = "Номер страницы веб-интерфейса (1, 2, …); названия страниц задаются в блоке «Веб-интерфейс»"

[[param]]
name = "color"
type = "string"
label = "Цвет"
default = ""
description = "Основной цвет виджета (шкала, линия графика, включённое состояние): #rrggbb или название, например red. Пусто — цвет страницы по умолчанию"

[[param]]
name = "back"
type = "string"
label = "Цвет фона"
default = ""
description = "Цвет фона плитки виджета: #rrggbb или название. Пусто — по умолчанию"
