[block]
type = "flash_store"
name = "Сохранение во флеш"
symbol = "FLASH"
group = "Прочее"
description = "Сохраняет число во флеш-память по фронту save и восстанавливает его после перезагрузки. Не пишет во флеш, если значение не изменилось."
memory = true
includes = ["Preferences.h"]

[[input]]
name = "in"
type = "float"
description = "Значение для сохранения"

[[input]]
name = "save"
type = "bool"
description = "Сохранить in по переходу false → true"

[[output]]
name = "out"
type = "float"
description = "Сохранённое значение (после перезагрузки — из флеша)"

[[param]]
name = "initial"
type = "float"
default = 0.0
description = "Значение, пока во флеше ничего не сохранено"
