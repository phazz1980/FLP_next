[block]
type = "wifi"
name = "Wi-Fi клиент"
symbol = "Wi-Fi"
group = "Сеть"
description = "Подключение ESP32 к точке доступа Wi-Fi (библиотека FLProg_Network)."
single = true
includes = ["flprogNetwork.h"]

[[output]]
name = "ready"
type = "bool"
description = "true, пока ESP32 подключён к сети и получил адрес"

[[param]]
name = "ssid"
type = "string"
description = "Имя сети (SSID)"

[[param]]
name = "password"
type = "string"
default = ""
description = "Пароль сети"

[[param]]
name = "dhcp"
type = "bool"
default = true
description = "Получать адрес автоматически (DHCP)"

[[param]]
name = "ip"
type = "string"
default = "192.168.1.177"
when = "not dhcp"
description = "Постоянный IP-адрес"

[[param]]
name = "gateway"
type = "string"
default = "192.168.1.1"
when = "not dhcp"
description = "Шлюз (он же DNS)"

[[param]]
name = "subnet"
type = "string"
default = "255.255.255.0"
when = "not dhcp"
description = "Маска подсети"
