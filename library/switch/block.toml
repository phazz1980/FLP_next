[block]
type = "switch"
name = "Переключатель"
symbol = "SWITCH"
group = "Переключатели"
description = "Выбор из двух: out = a, если sel = 0, иначе b. a и b — любого, но одного типа."

[[input]]
name = "sel"
type = "bool"
label = "Выбор"

[[input]]
name = "a"
type = "same"

[[input]]
name = "b"
type = "same"

[[output]]
name = "out"
type = "same"
