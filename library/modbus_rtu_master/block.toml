[block]
type = "modbus_rtu_master"
name = "Modbus RTU Master"
symbol = "MB MASTER"
group = "Сеть"
shared = "network"
description = "Ведущее устройство Modbus RTU на UART (RS-485): опрашивает до четырёх ведомых."
single = true
includes = ["flprogModbusRTU.h", "flprogUart.h"]

[block.uart]
param = "uart"
access = "exclusive"

[[param]]
name = "uart"
type = "int"
default = 2
min = 0
max = 2
description = "Номер UART: 1 или 2 (на ESP32-C3 только 1); скорость, формат и выводы — в настройках платы"

[[param]]
name = "count"
type = "int"
default = 1
min = 1
max = 4
description = "Число ведомых устройств"

[[param]]
name = "slave1"
type = "int"
default = 1
min = 1
max = 247
description = "Адрес ведомого 1"

[[param]]
name = "slave2"
type = "int"
default = 2
min = 1
max = 247
when = "count >= 2"
description = "Адрес ведомого 2"

[[param]]
name = "slave3"
type = "int"
default = 3
min = 1
max = 247
when = "count >= 3"
description = "Адрес ведомого 3"

[[param]]
name = "slave4"
type = "int"
default = 4
min = 1
max = 247
when = "count >= 4"
description = "Адрес ведомого 4"

[[param]]
name = "period"
type = "duration"
default = "1s"
min = 10
description = "Период опроса каждого ведомого"

[[param]]
name = "timeout"
type = "duration"
default = "1s"
min = 10
description = "Время ожидания ответа"

[[param]]
name = "holding"
type = "int"
default = 10
min = 0
description = "Сколько регистров хранения (4x) опрашивать у каждого ведомого, с адреса 0"

[[param]]
name = "input"
type = "int"
default = 10
min = 0
description = "Сколько входных регистров (3x) опрашивать, с адреса 0"

[[param]]
name = "coils"
type = "int"
default = 10
min = 0
description = "Сколько катушек (0x) опрашивать, с адреса 0"

[[param]]
name = "discrete"
type = "int"
default = 10
min = 0
description = "Сколько дискретных входов (1x) опрашивать, с адреса 0"
