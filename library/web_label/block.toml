[block]
type = "web_label"
name = "Заголовок страницы"
symbol = "TXT"
group = "Веб-интерфейс"
description = "Статичная надпись на веб-странице (заголовок раздела)."
memory = true

[[param]]
name = "caption"
type = "string"
label = "Подпись"
default = "Заголовок страницы"
description = "Подпись виджета на странице"

[[param]]
name = "col"
type = "int"
label = "Колонка"
default = 1
description = "Левая колонка сетки страницы (1–12)"

[[param]]
name = "row"
type = "int"
label = "Строка"
default = 1
description = "Верхняя строка сетки страницы (1, 2, …)"

[[param]]
name = "w"
type = "int"
label = "Ширина"
default = 12
description = "Ширина в колонках сетки (1–12)"

[[param]]
name = "h"
type = "int"
label = "Высота"
default = 1
description = "Высота в строках сетки"
