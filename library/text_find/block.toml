[block]
type = "text_find"
name = "Поиск подстроки"
symbol = "FIND"
group = "Строки"
description = "Позиция первого вхождения подстроки (с 0) или -1, если не найдена."

[[input]]
name = "text"
type = "string"

[[input]]
name = "sub"
type = "string"

[[output]]
