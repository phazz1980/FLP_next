[block]
type = "web_value"
name = "Веб-значение"
symbol = "VAL"
group = "Веб-интерфейс"
description = "Число на веб-странице: показывает значение входа."
memory = true

[[input]]
name = "in"
type = "float"

[[param]]
name = "caption"
type = "string"
label = "Подпись"
default = "Веб-значение"
description = "Подпись виджета на странице"

[[param]]
name = "unit"
type = "string"
label = "Единица"
default = ""
description = "Единица измерения рядом со значением"

[[param]]
name = "decimals"
type = "int"
label = "Знаков"
default = 1
description = "Знаков после запятой"

[[param]]
name = "col"
type = "int"
label = "Колонка"
default = 1
description = "Левая колонка сетки страницы (1–12)"

[[param]]
name = "row"
type = "int"
label = "Строка"
default = 1
description = "Верхняя строка сетки страницы (1, 2, …)"

[[param]]
name = "w"
type = "int"
label = "Ширина"
default = 3
description = "Ширина в колонках сетки (1–12)"

[[param]]
name = "h"
type = "int"
label = "Высота"
default = 2
description = "Высота в строках сетки"
