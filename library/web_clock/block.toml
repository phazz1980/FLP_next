[block]
type = "web_clock"
name = "Веб-часы"
symbol = "CLK"
group = "Веб-интерфейс"
shared = "network"
description = "Пассивный виджет: время и дата на веб-странице. Показывает часы устройства, на котором открыта страница (браузера), — ESP32 для этого не нужен."
memory = true

[[param]]
name = "caption"
type = "string"
label = "Подпись"
default = "Время"
description = "Подпись виджета на странице"

[[param]]
name = "seconds"
type = "bool"
label = "Секунды"
default = true
description = "Показывать секунды"

[[param]]
name = "date"
type = "bool"
label = "Дата"
default = true
description = "Показывать дату под временем"

[[param]]
name = "col"
show = "hidden"
type = "int"
label = "Колонка"
default = 1
description = "Левая колонка сетки страницы (1–24)"

[[param]]
name = "row"
show = "hidden"
type = "int"
label = "Строка"
default = 1
description = "Верхняя строка сетки страницы (1, 2, …)"

[[param]]
name = "w"
show = "hidden"
type = "int"
label = "Ширина"
default = 6
description = "Ширина в колонках сетки (1–24)"

[[param]]
name = "h"
show = "hidden"
type = "int"
label = "Высота"
default = 4
description = "Высота в строках сетки (строка — 24 px)"

[[param]]
name = "page"
show = "hidden"
type = "int"
label = "Страница"
default = 1
description = "Номер страницы веб-интерфейса (1, 2, …); названия страниц задаются в блоке «Веб-интерфейс»"

[[param]]
name = "color"
type = "string"
label = "Цвет"
default = ""
description = "Основной цвет виджета (шкала, линия графика, включённое состояние): #rrggbb или название, например red. Пусто — цвет страницы по умолчанию"

[[param]]
name = "back"
type = "string"
label = "Цвет фона"
default = ""
description = "Цвет фона плитки виджета: #rrggbb или название. Пусто — по умолчанию"
