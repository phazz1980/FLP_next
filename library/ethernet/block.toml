[block]
type = "ethernet"
name = "Ethernet W5500"
symbol = "ETH"
group = "Сеть"
shared = "network"
description = "Проводная сеть на модуле W5500 (W5100, W5200) по SPI (библиотека FLProg_Network)."
single = true
hidden = true
pullable = true
includes = ["flprogNetwork.h", "flprogWebServer.h", "service/flprogNetworkOta.h", "Update.h"]

[[output]]
name = "ready"
type = "bool"
description = "true, пока кабель подключён и адрес получен"

[[output]]
name = "address"
type = "string"
label = "IP"
when = "out_address"
description = "IP-адрес в проводной сети; пустая строка, пока нет связи"

[[param]]
name = "cs"
type = "pin"
mode = "out"
default = 5
description = "Вывод CS модуля"

[[param]]
name = "sck"
type = "pin"
mode = "out"
default = 18
description = "Вывод SCK модуля (SPI)"

[[param]]
name = "miso"
type = "pin"
mode = "in"
default = 19
description = "Вывод MISO модуля (SPI)"

[[param]]
name = "mosi"
type = "pin"
mode = "out"
default = 23
description = "Вывод MOSI модуля (SPI)"

[[param]]
name = "out_address"
type = "bool"
label = "Выход IP"
default = false
show = "hidden"
description = "Показать выход IP-адреса"

[[param]]
name = "mac"
type = "int"
default = 40
min = 0
max = 255
description = "Последний байт MAC-адреса 78:AC:C0:2C:3E:xx — разный у устройств в одной сети"

[[param]]
name = "dhcp"
type = "bool"
runtime = true
default = true
description = "Получать адрес автоматически (DHCP)"

[[param]]
name = "ip"
type = "string"
runtime = true
default = "192.168.1.177"
when = "not dhcp"
description = "Постоянный IP-адрес"

[[param]]
name = "gateway"
type = "string"
runtime = true
default = "192.168.1.1"
when = "not dhcp"
description = "Шлюз (он же DNS)"

[[param]]
name = "subnet"
type = "string"
runtime = true
default = "255.255.255.0"
when = "not dhcp"
description = "Маска подсети"

[[param]]
name = "net_period"
type = "int"
label = "Период опроса сети, мс"
default = 5
min = 0
max = 1000
description = "Как часто обслуживать сеть (MQTT, веб-страницу). По умолчанию 5 мс; 0 — в каждом цикле. Чем больше период, тем быстрее цикл схемы, но тем позже отвечают MQTT и веб-страница (не дольше чем на период)"
