[block]
type = "ethernet"
name = "Ethernet W5500"
symbol = "ETH"
group = "Сеть"
description = "Проводная сеть на модуле W5500 (W5100, W5200) по SPI (библиотека FLProg_Network)."
single = true
hidden = true
includes = ["flprogNetwork.h", "flprogWebServer.h", "service/flprogNetworkOta.h", "Update.h"]

[[output]]
name = "ready"
type = "bool"
description = "true, пока кабель подключён и адрес получен"

[[param]]
name = "cs"
type = "pin"
mode = "out"
default = 5
description = "Вывод CS модуля (SPI по умолчанию: SCK 18, MISO 19, MOSI 23)"

[[param]]
name = "mac"
type = "int"
default = 40
min = 0
max = 255
description = "Последний байт MAC-адреса 78:AC:C0:2C:3E:xx — разный у устройств в одной сети"

[[param]]
name = "dhcp"
type = "bool"
runtime = true
default = true
description = "Получать адрес автоматически (DHCP)"

[[param]]
name = "ip"
type = "string"
default = "192.168.1.177"
when = "not dhcp"
description = "Постоянный IP-адрес"

[[param]]
name = "gateway"
type = "string"
default = "192.168.1.1"
when = "not dhcp"
description = "Шлюз (он же DNS)"

[[param]]
name = "subnet"
type = "string"
default = "255.255.255.0"
when = "not dhcp"
description = "Маска подсети"

[[param]]
name = "web"
type = "bool"
runtime = true
label = "Веб-страница"
default = true
description = "Страница-заглушка на порту 80: IP, MAC, аптайм, версия сборки и состояние обновления"

[[param]]
name = "web_update"
type = "bool"
runtime = true
label = "Загрузка прошивки"
default = true
when = "web"
description = "Форма на странице для загрузки прошивки (.bin): файл принимает отдельный приёмник на порту 8080 и пишет в память, затем устройство перезагружается"

[[param]]
name = "ota"
type = "bool"
runtime = true
label = "Обновление по сети"
default = true
description = "Прошивку можно обновить по сети (OTA) — менеджером OTA FLProg или Arduino IDE. Имя устройства — id блока"

[[param]]
name = "ota_password"
type = "string"
label = "Пароль OTA"
default = ""
when = "ota or web_update"
show = "secret"
description = "Пароль обновления (по сети и через страницу); пусто — без пароля (любой в сети может залить прошивку)"
