[block]
type = "mux"
name = "Мультиплексор"
symbol = "MUX"
group = "Переключатели"
description = "Выбор из 2–16 входов по номеру sel: 0 — a, 1 — b, 2 — c … 15 — p. Номер за пределами берётся с ближайшего края. Входы a…p — любого, но одного типа."

[[input]]
name = "sel"
type = "number"
default = 0.0
label = "Номер"

[[input]]
name = "a"
type = "same"
default = 0.0

[[input]]
name = "b"
type = "same"
default = 0.0

[[input]]
name = "c"
type = "same"
default = 0.0
when = "count >= 3"

[[input]]
name = "d"
type = "same"
default = 0.0
when = "count >= 4"

[[input]]
name = "e"
type = "same"
default = 0.0
when = "count >= 5"

[[input]]
name = "f"
type = "same"
default = 0.0
when = "count >= 6"

[[input]]
name = "g"
type = "same"
default = 0.0
when = "count >= 7"

[[input]]
name = "h"
type = "same"
default = 0.0
when = "count >= 8"

[[input]]
name = "i"
type = "same"
default = 0.0
when = "count >= 9"

[[input]]
name = "j"
type = "same"
default = 0.0
when = "count >= 10"

[[input]]
name = "k"
type = "same"
default = 0.0
when = "count >= 11"

[[input]]
name = "l"
type = "same"
default = 0.0
when = "count >= 12"

[[input]]
name = "m"
type = "same"
default = 0.0
when = "count >= 13"

[[input]]
name = "n"
type = "same"
default = 0.0
when = "count >= 14"

[[input]]
name = "o"
type = "same"
default = 0.0
when = "count >= 15"

[[input]]
name = "p"
type = "same"
default = 0.0
when = "count >= 16"

[[output]]
name = "out"
type = "same"

[[param]]
name = "count"
label = "входов"
type = "int"
default = 2
min = 2
max = 16
description = "Число входов"
