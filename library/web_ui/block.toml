[block]
type = "web_ui"
name = "Веб-интерфейс"
symbol = "WEB"
group = "Веб-интерфейс"
shared = "network"
description = "Страница управления на ESP32 (главная страница, адрес /): на ней показываются блоки группы «Веб-интерфейс» — кнопки, переключатели, ползунки, индикаторы. Нужен блок Wi-Fi с включённой веб-страницей. Раскладку виджетов удобно собирать в конструкторе (flp-web, адрес /designer)."
single = true
hidden = true

[[param]]
name = "title"
type = "string"
label = "Заголовок"
default = "Панель управления"
description = "Заголовок страницы"

[[param]]
name = "pages"
type = "string"
label = "Страницы"
default = "Главная"
description = "Названия страниц через точку с запятой, например «Главная;Насос;Настройки». Слева появится меню страниц (на узком экране — полоса сверху). Виджет относится к странице по номеру в параметре «Страница»."

[[param]]
name = "password"
type = "string"
label = "Пароль страницы"
default = ""
show = "secret"
description = "Пароль для входа на страницу: без него устройство не отдаёт ни значения, ни настройки, ни обновление. Пусто — вход свободный. Пароль передаётся по сети открытым текстом (HTTP), это защита от случайного доступа, а не от перехвата. Хранится в файле проекта."

[[param]]
name = "system"
type = "bool"
label = "Страница «Система»"
default = true
description = "Последняя страница меню с техническими данными: адрес, MAC, сигнал Wi-Fi, аптайм, память, чип, версия сборки. Если в блоке Wi-Fi включена загрузка прошивки — на ней же форма обновления."

[[param]]
name = "bg"
type = "string"
label = "Цвет фона страницы"
default = ""
description = "Фон всей страницы: #rrggbb или название, например #101820. Пусто — светлая или тёмная тема по настройке браузера"
