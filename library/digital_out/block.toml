[block]
type = "digital_out"
name = "Цифровой выход"
symbol = "DO"
group = "Входы и выходы"
description = "Выставляет логический уровень на выводе платы."

[[input]]
name = "in"
type = "bool"
description = "true — высокий уровень (или низкий при инверсии)"

[[input]]
name = "en"
type = "bool"
default = true
when = "write_enable"
description = "Разрешение записи: пока false, выход сохраняет прежнее состояние"

[[param]]
name = "pin"
type = "pin"
description = "Номер вывода GPIO"

[[param]]
name = "inverted"
type = "bool"
default = false
description = "Инвертировать выход (для реле, включаемых низким уровнем)"

[[param]]
name = "write_enable"
type = "bool"
default = false
description = "Добавить вход «Разрешение записи» (en)"
