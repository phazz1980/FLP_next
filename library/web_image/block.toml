[block]
type = "web_image"
name = "Веб-картинка"
symbol = "IMG"
group = "Веб-интерфейс"
shared = "network"
description = "Пассивный виджет: картинка на веб-странице по ссылке (схема, логотип, фото). Файл сам не хранится на ESP32 — укажите адрес, который открывается из браузера (внешний сайт или другой хост в сети)."
memory = true

[[param]]
name = "caption"
type = "string"
show = "value"
label = "Подпись"
default = ""
description = "Подпись виджета на странице"

[[param]]
name = "url"
type = "string"
label = "Адрес картинки"
default = ""
description = "Ссылка на картинку (http://… или https://…), которую загрузит браузер"

[[param]]
name = "fit"
type = "bool"
label = "Вписать целиком"
default = true
description = "Включено — картинка вписывается без обрезки; выключено — заполняет плитку, лишнее обрезается"

[[param]]
name = "col"
show = "hidden"
type = "int"
label = "Колонка"
default = 1
description = "Левая колонка сетки страницы (1–24)"

[[param]]
name = "row"
show = "hidden"
type = "int"
label = "Строка"
default = 1
description = "Верхняя строка сетки страницы (1, 2, …)"

[[param]]
name = "w"
show = "hidden"
type = "int"
label = "Ширина"
default = 8
description = "Ширина в колонках сетки (1–24)"

[[param]]
name = "h"
show = "hidden"
type = "int"
label = "Высота"
default = 8
description = "Высота в строках сетки (строка — 24 px)"

[[param]]
name = "page"
show = "hidden"
type = "int"
label = "Страница"
default = 1
description = "Номер страницы веб-интерфейса (1, 2, …); названия страниц задаются в блоке «Веб-интерфейс»"

[[param]]
name = "color"
type = "string"
label = "Цвет"
default = ""
description = "Основной цвет виджета (шкала, линия графика, включённое состояние): #rrggbb или название, например red. Пусто — цвет страницы по умолчанию"

[[param]]
name = "back"
type = "string"
label = "Цвет фона"
default = ""
description = "Цвет фона плитки виджета: #rrggbb или название. Пусто — по умолчанию"
