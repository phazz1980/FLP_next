[block]
type = "uart_read"
name = "Чтение из UART"
symbol = "UART RX"
group = "UART"
description = "Принимает данные из UART: строку до разделителя (line, импульс ready) или по одному байту."

[block.uart]
param = "port"
access = "read"

[[output]]
name = "line"
type = "string"
when = "mode == 0"
description = "Последняя принятая строка, без разделителя"

[[output]]
name = "ready"
type = "bool"
when = "mode == 0"
description = "true на один цикл, когда пришла новая строка"

[[output]]
name = "byte"
type = "int"
when = "mode == 1"
description = "Последний принятый байт, 0…255"

[[output]]
name = "new"
type = "bool"
when = "mode == 1"
description = "true на один цикл, когда пришёл байт"

[[output]]
name = "available"
type = "int"
description = "Сколько байт ещё ждёт в буфере приёма"

[[param]]
name = "port"
label = "порт"
type = "int"
default = 2
min = -1
max = 2
description = "USB (монитор порта, в отладке — ввод в консоли) или UART из настроек платы; UART0 свободен только у ESP32-C3/S3"

[[param.choice]]
value = -1
label = "USB (монитор порта)"

[[param.choice]]
value = 0
label = "UART0"

[[param.choice]]
value = 1
label = "UART1"

[[param.choice]]
value = 2
label = "UART2"

[[param]]
name = "mode"
label = "как читать"
type = "int"
default = 0
min = 0
max = 1
description = "Как читать: строками до разделителя или по одному байту за цикл"

[[param.choice]]
value = 0
label = "Строками до разделителя"

[[param.choice]]
value = 1
label = "По одному байту"

[[param]]
name = "end"
label = "разделитель"
type = "int"
default = 0
min = 0
max = 2
when = "mode == 0"
description = "Конец строки"

[[param.choice]]
value = 0
label = "\\n (\\r отбрасывается)"

[[param.choice]]
value = 1
label = "\\r (\\n отбрасывается)"

[[param.choice]]
value = 2
label = "Свой символ"

[[param]]
name = "end_char"
label = "символ разделителя"
type = "string"
default = ";"
when = "mode == 0 and end == 2"
description = "Первый символ строки — разделитель, например «;»"

[[param]]
name = "timeout"
label = "конец по паузе"
type = "duration"
default = "0ms"
when = "mode == 0"
description = "Пауза, после которой принятое считается строкой и без разделителя; 0 — не ждать паузы"

[[param]]
name = "max_len"
label = "макс. длина"
type = "int"
default = 64
min = 1
max = 1024
when = "mode == 0"
description = "Строка длиннее обрывается и выдаётся частями"
