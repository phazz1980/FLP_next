[package]
name = "flp-ai"
description = "Shared command set for the AI assistant and the MCP server of CrabLogic"
version.workspace = true
edition.workspace = true

[dependencies]
flp-build = { path = "../flp-build" }
flp-codegen = { path = "../flp-codegen" }
flp-core = { path = "../flp-core" }
flp-pdf = { path = "../flp-pdf" }
flp-debug = { path = "../flp-debug", features = ["serial"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq = { version = "2", features = ["json"] }
