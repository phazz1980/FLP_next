[package]
name = "flp-cli"
description = "Command line of FLP_next: check / gen / build / upload"
version.workspace = true
edition.workspace = true

[[bin]]
name = "flp"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
flp-build = { path = "../flp-build" }
flp-codegen = { path = "../flp-codegen" }
flp-core = { path = "../flp-core" }
