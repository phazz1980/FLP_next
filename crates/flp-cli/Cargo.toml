[package]
name = "flp-cli"
description = "Command line of CrabLogic: check / gen / build / upload"
version.workspace = true
edition.workspace = true

[[bin]]
name = "crablogic"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
flp-build = { path = "../flp-build" }
flp-codegen = { path = "../flp-codegen" }
flp-core = { path = "../flp-core" }
flp-pdf = { path = "../flp-pdf" }
flp-debug = { path = "../flp-debug", features = ["serial"] }
