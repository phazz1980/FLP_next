[package]
name = "crab-debug"
description = "Online debugging protocol and host session of CrabLogic"
version.workspace = true
edition.workspace = true

[features]
default = []
# Serial port transport (USB). Off for crates that only need the protocol.
serial = ["dep:serialport"]

[dependencies]
crab-core = { path = "../crab-core" }
thiserror.workspace = true
serialport = { version = "4", optional = true, default-features = false }
