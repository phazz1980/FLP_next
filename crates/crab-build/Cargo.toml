[package]
name = "crab-build"
description = "Building and uploading CrabLogic firmware with arduino-cli"
version.workspace = true
edition.workspace = true

[dependencies]
crab-blocks = { path = "../crab-blocks" }
crab-codegen = { path = "../crab-codegen" }
crab-core = { path = "../crab-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"
wasmparser = "0.263"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust = { version = "0.6.1", default-features = false }

[dev-dependencies]
toml.workspace = true
