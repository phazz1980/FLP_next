[package]
name = "flp-editor"
description = "Graphical FBD editor of FLP_next"
version.workspace = true
edition.workspace = true

[[bin]]
name = "flp-editor"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
flp-ai = { path = "../flp-ai" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
flp-build = { path = "../flp-build" }
flp-codegen = { path = "../flp-codegen" }
flp-core = { path = "../flp-core" }
flp-debug = { path = "../flp-debug", features = ["serial"] }
rfd = "0.17"
