[package]
name = "flp-editor"
description = "Graphical FBD editor of CrabLogic"
version.workspace = true
edition.workspace = true

[[bin]]
name = "crablogic-editor"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = "0.37"
flp-ai = { path = "../flp-ai" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
flp-build = { path = "../flp-build" }
flp-codegen = { path = "../flp-codegen" }
flp-core = { path = "../flp-core" }
flp-pdf = { path = "../flp-pdf" }
flp-debug = { path = "../flp-debug", features = ["serial"] }
rfd = "0.17"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
egui_extras = { version = "0.37", default-features = false, features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
embed-resource = "3"
