<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLP_next — веб-интерфейс</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --line: #d5d9e0; --text: #1d2330; --muted: #667085;
  --accent: #2563eb; --cell: #e9edf3; --card: #dbe6fb; --err: #dc2626;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --panel: #1c2028; --line: #323846; --text: #e6e9f0; --muted: #98a1b3;
    --accent: #6b9bff; --cell: #242a35; --card: #2c3a58; --err: #f87171;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif;
  display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 220px minmax(0, 1fr) 300px; }
header { grid-column: 1 / 4; display: flex; gap: 8px; align-items: center; padding: 8px 12px;
  background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0 12px 0 0; }
a { color: var(--accent); }
button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 5px; padding: 3px 6px; width: 100%; }
input[type=checkbox] { width: auto; }
aside { background: var(--panel); overflow: auto; padding: 10px; }
#palette { border-right: 1px solid var(--line); }
#props { border-left: 1px solid var(--line); }
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
aside h2:first-child { margin-top: 0; }
.pal { display: block; width: 100%; text-align: left; margin: 3px 0; }
.pal small { display: block; color: var(--muted); }
main { overflow: auto; padding: 12px; min-width: 0; max-width: 100vw; }
#grid { position: relative; margin-bottom: 14px; border-radius: 8px; border: 1px dashed var(--line); }
.item { position: absolute; background: var(--card); border: 1.5px solid var(--line); border-radius: 7px;
  padding: 3px 8px; overflow: hidden; cursor: grab; user-select: none; touch-action: none; font-size: 12px; }
.item.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.item b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item span { color: var(--muted); font-size: 11px; }
.item .rs { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize;
  background: linear-gradient(135deg, transparent 50%, var(--accent) 50%); }
#preview { width: 100%; height: 420px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
label.f { display: block; margin: 8px 0 2px; font-size: 12px; color: var(--muted); }
.row { display: flex; gap: 6px; align-items: center; }
#status { grid-column: 1 / 4; padding: 6px 80px 6px 12px; border-top: 1px solid var(--line); background: var(--panel); min-height: 30px; }
#status .err { color: var(--err); }
#version { position: fixed; right: 12px; bottom: 6px; color: var(--muted); font-size: 12px; pointer-events: none; }
.hint { color: var(--muted); font-size: 12px; margin: 6px 0; }
@media (max-width: 900px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto auto auto auto auto; height: auto; }
  header, #status { grid-column: 1; }
  #palette, #props { border: 0; border-bottom: 1px solid var(--line); }
  #palette { display: flex; flex-wrap: wrap; gap: 4px; }
  #palette h2 { width: 100%; }
  .pal { width: auto; }
}
</style>
</head>
<body>
<header>
  <h1>Веб-интерфейс ESP32</h1>
  <button id="addHost" hidden>Добавить блок «Веб-интерфейс»</button>
  <span class="hint" id="hostHint"></span>
</header>

<aside id="palette"></aside>

<main>
  <div id="grid"></div>
  <h2 style="font-size:12px;color:var(--muted);text-transform:uppercase;margin:0 0 6px">Предпросмотр (та же страница, что в прошивке)</h2>
  <iframe id="preview" title="Предпросмотр"></iframe>
</main>

<aside id="props"></aside>
<div id="status"></div>
<div id="version">v{{VERSION}}</div>

<script>
"use strict";
const GROUP = "Веб-интерфейс";
const COLS = 12, CW = 60, CH = 44, GAP = 6;
const $ = (id) => document.getElementById(id);
let types = {}, schema = null, selected = null, pageHtml = "";

async function api(name, args = {}) {
  const r = await fetch("/api/" + name, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(args),
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.result;
}
function say(text, err) {
  const s = $("status");
  s.textContent = "";
  const span = document.createElement("span");
  if (err) span.className = "err";
  span.textContent = text;
  s.appendChild(span);
}
async function act(fn) {
  try { await fn(); } catch (e) { say(e.message, true); }
  await reload();
}

const isWidget = (b) => b.type.startsWith("web_") && b.type !== "web_ui";
const val = (b, p) => (b[p.name] !== undefined && b[p.name] !== null ? b[p.name] : p.default);
const num = (v, d) => (typeof v === "number" ? v : d);

function widgetParam(b, name, d) {
  const p = (types[b.type]?.params || []).find((x) => x.name === name);
  return p ? val(b, p) : d;
}
function rect(b) {
  return {
    c: num(widgetParam(b, "col", 1), 1), r: num(widgetParam(b, "row", 1), 1),
    w: num(widgetParam(b, "w", 3), 3), h: num(widgetParam(b, "h", 1), 1),
  };
}

async function reload() {
  schema = await api("get_schema");
  render();
}

function render() {
  const widgets = (schema.logic.block || []).filter(isWidget);
  const host = (schema.logic.block || []).find((b) => b.type === "web_ui");
  const wifi = (schema.logic.block || []).find((b) => b.type === "wifi");
  $("addHost").hidden = !!host;
  $("hostHint").textContent = !wifi
    ? "В схеме нет блока Wi-Fi: без него страница не заработает."
    : (host ? "" : "Страница появится в прошивке после добавления блока «Веб-интерфейс».");

  // grid
  const g = $("grid");
  g.textContent = "";
  const rows = Math.max(8, ...widgets.map((b) => rect(b).r + rect(b).h));
  g.style.width = COLS * (CW + GAP) - GAP + "px";
  g.style.height = rows * (CH + GAP) - GAP + "px";
  g.style.backgroundImage = "linear-gradient(var(--cell) 1px, transparent 1px), linear-gradient(90deg, var(--cell) 1px, transparent 1px)";
  g.style.backgroundSize = `${CW + GAP}px ${CH + GAP}px`;
  for (const b of widgets) g.appendChild(itemEl(b));

  renderPalette();
  renderProps();
  renderPreview(widgets, host);
}

function itemEl(b) {
  const t = types[b.type];
  const { c, r, w, h } = rect(b);
  const el = document.createElement("div");
  el.className = "item" + (b.id === selected ? " sel" : "");
  place(el, c, r, w, h);
  const cap = document.createElement("b");
  cap.textContent = String(widgetParam(b, "caption", b.id));
  const sub = document.createElement("span");
  sub.textContent = `${t ? t.name : b.type} · ${b.id}`;
  el.append(cap, sub);
  const rs = document.createElement("div");
  rs.className = "rs";
  el.appendChild(rs);
  drag(el, rs, b);
  return el;
}
function place(el, c, r, w, h) {
  el.style.left = (c - 1) * (CW + GAP) + "px";
  el.style.top = (r - 1) * (CH + GAP) + "px";
  el.style.width = w * (CW + GAP) - GAP + "px";
  el.style.height = h * (CH + GAP) - GAP + "px";
}

function drag(el, handle, b) {
  el.addEventListener("pointerdown", (ev) => {
    const resize = ev.target === handle;
    const start = { x: ev.clientX, y: ev.clientY, ...rect(b) };
    let cur = { ...start }, moved = false;
    el.setPointerCapture(ev.pointerId);
    if (selected !== b.id) { selected = b.id; renderProps(); document.querySelectorAll(".item").forEach((e) => e.classList.remove("sel")); el.classList.add("sel"); }
    const move = (e) => {
      const dc = Math.round((e.clientX - start.x) / (CW + GAP));
      const dr = Math.round((e.clientY - start.y) / (CH + GAP));
      if (dc || dr) moved = true;
      if (resize) {
        cur = { ...start, w: Math.max(1, Math.min(COLS - start.c + 1, start.w + dc)), h: Math.max(1, start.h + dr) };
      } else {
        cur = { ...start, c: Math.max(1, Math.min(COLS - start.w + 1, start.c + dc)), r: Math.max(1, start.r + dr) };
      }
      place(el, cur.c, cur.r, cur.w, cur.h);
    };
    const up = async () => {
      el.removeEventListener("pointermove", move);
      el.removeEventListener("pointerup", up);
      if (!moved) return;
      await act(async () => {
        await api("set_params", { id: b.id, params: { col: cur.c, row: cur.r, w: cur.w, h: cur.h } });
      });
    };
    el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", up);
  });
}

function renderPalette() {
  const p = $("palette");
  p.textContent = "";
  const h = document.createElement("h2");
  h.textContent = "Виджеты";
  p.appendChild(h);
  for (const t of Object.values(types)) {
    if (t.type === "web_ui") continue;
    const btn = document.createElement("button");
    btn.className = "pal";
    btn.textContent = t.name;
    const small = document.createElement("small");
    small.textContent = t.description.split(":")[0];
    btn.appendChild(small);
    btn.title = t.description;
    btn.onclick = () => act(async () => {
      const { c, r } = freeSpot(t);
      const res = await api("add_block", { type: t.type, params: { col: c, row: r } });
      selected = res.id || selected;
    });
    p.appendChild(btn);
  }
}

// First free place for a new widget: below everything that is already on the page.
function freeSpot(t) {
  const widgets = (schema.logic.block || []).filter(isWidget);
  const bottom = Math.max(0, ...widgets.map((b) => rect(b).r + rect(b).h - 1));
  return { c: 1, r: bottom + 1 };
}

function sources(inputType) {
  // all block outputs of a compatible type (the schema view lists the active ports)
  const out = [];
  for (const [id, v] of Object.entries(schema.view || {})) {
    for (const o of v.outputs || []) {
      if (o.type === inputType || o.type === "any" || inputType === "any") out.push(`${id}.${o.name}`);
    }
  }
  return out;
}

function renderProps() {
  const el = $("props");
  el.textContent = "";
  const b = (schema.logic.block || []).find((x) => x.id === selected && isWidget(x));
  const host = (schema.logic.block || []).find((x) => x.type === "web_ui");
  const h = document.createElement("h2");
  h.textContent = b ? `${types[b.type]?.name || b.type} · ${b.id}` : "Свойства";
  el.appendChild(h);
  if (!b) {
    if (host) el.appendChild(paramField(host, types.web_ui.params[0]));
    const p = document.createElement("p");
    p.className = "hint";
    p.textContent = "Добавьте виджет слева и перетащите его в сетку. Выделите виджет, чтобы настроить подпись, единицы и привязку к схеме.";
    el.appendChild(p);
    return;
  }
  const t = types[b.type];
  for (const p of t.params) el.appendChild(paramField(b, p));

  // bindings: inputs take a source from the schema, outputs show where they go
  const view = (schema.view || {})[b.id] || { inputs: [], outputs: [] };
  if (view.inputs.length) {
    const h2 = document.createElement("h2");
    h2.textContent = "Источник сигнала";
    el.appendChild(h2);
    for (const inp of view.inputs) {
      const cur = ((schema.logic.link || []).find((l) => l.to === `${b.id}.${inp.name}`) || {}).from || "";
      const sel = document.createElement("select");
      const none = new Option("— не подключено —", "");
      sel.appendChild(none);
      for (const s of sources(inp.type)) sel.appendChild(new Option(s, s));
      if (cur && ![...sel.options].some((o) => o.value === cur)) sel.appendChild(new Option(cur, cur));
      sel.value = cur;
      sel.onchange = () => act(async () => {
        if (!sel.value) await api("disconnect", { to: `${b.id}.${inp.name}` });
        else await api("connect", { from: sel.value, to: `${b.id}.${inp.name}` });
      });
      const lab = document.createElement("label");
      lab.className = "f";
      lab.textContent = `Вход «${inp.label || inp.name}» (${inp.type})`;
      el.append(lab, sel);
    }
  }
  if (view.outputs.length) {
    const h2 = document.createElement("h2");
    h2.textContent = "Куда идёт сигнал";
    el.appendChild(h2);
    for (const o of view.outputs) {
      const to = (schema.logic.link || []).filter((l) => l.from === `${b.id}.${o.name}`).map((l) => l.to);
      const p = document.createElement("div");
      p.className = "hint";
      p.textContent = `${b.id}.${o.name} → ${to.length ? to.join(", ") : "никуда (соедините в схеме)"}`;
      el.appendChild(p);
    }
  }
  const del = document.createElement("button");
  del.textContent = "Удалить виджет";
  del.style.marginTop = "14px";
  del.onclick = () => act(async () => { await api("remove_block", { id: b.id }); selected = null; });
  el.appendChild(del);
}

function paramField(b, p) {
  const wrap = document.createElement("div");
  const lab = document.createElement("label");
  lab.className = "f";
  lab.textContent = p.label || p.name;
  lab.title = p.description || "";
  const v = val(b, p);
  let inp;
  if (p.kind === "bool") {
    inp = document.createElement("input");
    inp.type = "checkbox";
    inp.checked = !!v;
    inp.onchange = () => set(b, p.name, inp.checked);
  } else {
    inp = document.createElement("input");
    inp.type = p.kind === "string" ? "text" : "number";
    if (p.kind === "float") inp.step = "any";
    inp.value = v === null || v === undefined ? "" : v;
    inp.onchange = () => {
      if (p.kind === "string") return set(b, p.name, inp.value);
      const n = Number(inp.value);
      set(b, p.name, p.kind === "int" ? Math.round(n) : n);
    };
  }
  wrap.append(lab, inp);
  return wrap;
}
function set(b, name, value) {
  return act(async () => { await api("set_params", { id: b.id, params: { [name]: value } }); });
}

// ---- preview: the device page with its three requests answered locally ----
function renderPreview(widgets, host) {
  const layout = { t: host ? String(widgetParam(host, "title", "")) : "Панель", i: [] };
  const state = [];
  for (const b of widgets) {
    const k = b.type.slice(4);
    const r = rect(b);
    const g = (n, d) => { const x = widgetParam(b, n, d); return x === undefined || x === null ? d : x; };
    const min = num(g("min", 0), 0), max = num(g("max", 0), 0);
    layout.i.push({
      k, l: String(g("caption", "")), u: String(g("unit", "")), c: r.c, r: r.r, w: r.w, h: r.h,
      d: k === "value" ? num(g("decimals", 1), 1) : (k === "gauge" ? 1 : 3),
      a: min, b: max, s: num(g("step", 1), 1),
    });
    let v = 0;
    if (k === "switch") v = g("initial", false) ? 1 : 0;
    else if (k === "slider" || k === "input") v = num(g("initial", 0), 0);
    else if (k === "led") v = 1;
    else if (k === "gauge") v = (min + max) / 2;
    else if (k === "value") v = 12.3;
    else if (k === "text") v = "Текст со входа";
    state.push(v);
  }
  const shim = `<script>
var L=${JSON.stringify(layout)},S=${JSON.stringify(state)};
window.fetch=function(u){u=String(u);
 if(u.indexOf('/ui/layout')==0)return Promise.resolve({json:function(){return Promise.resolve(L)}});
 if(u.indexOf('/ui/state')==0)return Promise.resolve({json:function(){return Promise.resolve(S)}});
 var m=/[?&]i=(\\d+)&v=([^&]*)/.exec(u);if(m)S[+m[1]]=+m[2];
 return Promise.resolve({})};
<\/script>`;
  $("preview").srcdoc = pageHtml.replace("</head>", shim + "</head>");
}

$("addHost").onclick = () => act(async () => { await api("add_block", { type: "web_ui", id: "ui" }); });

(async function init() {
  try {
    const list = await api("list_block_types", { filter: "web_" });
    for (const t of list) if (t.group === GROUP) types[t.type] = t;
    const r = await fetch("/ui_page.html");
    if (!r.ok) throw new Error(await r.text());
    pageHtml = await r.text();
    await reload();
    say("Готово. Изменения сохраняются в проект сразу; прошивку соберите в редакторе схемы или командой flp build.");
  } catch (e) { say(e.message, true); }
})();
// keeps the server alive while the page is open
setInterval(() => fetch("/ping").catch(() => {}), 10000);
</script>
</body>
</html>
