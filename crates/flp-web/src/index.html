<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLP_next — веб-редактор</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --line: #d5d9e0; --text: #1d2330; --muted: #667085;
  --accent: #2563eb; --block: #ffffff; --head: #e8eefc; --grid: #e6e9ef;
  --bool: #16a34a; --int: #2563eb; --float: #d97706; --string: #9333ea; --any: #667085;
  --err: #dc2626; --warn: #d97706;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --panel: #1c2028; --line: #323846; --text: #e6e9f0; --muted: #98a1b3;
    --accent: #6b9bff; --block: #232834; --head: #2c3548; --grid: #1f242d;
    --bool: #4ade80; --int: #6b9bff; --float: #fbbf24; --string: #c084fc; --any: #98a1b3;
    --err: #f87171; --warn: #fbbf24;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif;
  display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 250px 1fr 300px; }
header { grid-column: 1 / 4; display: flex; gap: 8px; align-items: center; padding: 8px 12px;
  background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0 12px 0 0; }
button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button:disabled { opacity: .5; cursor: wait; }
input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 5px; padding: 3px 6px; width: 100%; }
aside { background: var(--panel); overflow: auto; padding: 10px; }
#palette { border-right: 1px solid var(--line); }
#props { border-left: 1px solid var(--line); }
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
details { margin: 2px 0; }
summary { cursor: pointer; padding: 3px 0; font-weight: 600; }
.pal { display: block; width: 100%; text-align: left; margin: 2px 0; padding: 3px 8px; font-size: 13px; }
main { position: relative; overflow: hidden; min-width: 0; background: var(--bg); }
#tabs { position: absolute; top: 6px; left: 8px; display: flex; gap: 4px; z-index: 2; }
#tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
svg#canvas { width: 100%; height: 100%; display: block; cursor: grab; }
.block rect.body { fill: var(--block); stroke: var(--line); stroke-width: 1.2; }
.block.sel rect.body { stroke: var(--accent); stroke-width: 2.4; }
.block rect.head { fill: var(--head); }
.block text { fill: var(--text); font-size: 11px; pointer-events: none; }
.block text.title { font-weight: 700; font-size: 12px; }
.block text.sub { fill: var(--muted); font-size: 9.5px; }
.block text.cst { fill: var(--accent); }
.block text.shown { fill: var(--muted); font-size: 10px; }
.port { stroke: var(--panel); stroke-width: 1.5; cursor: crosshair; }
.port:hover { stroke: var(--accent); stroke-width: 3; }
.link { fill: none; stroke-width: 2; }
.link.sel { stroke-width: 4; }
.hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.bool { stroke: var(--bool); fill: var(--bool); } .int { stroke: var(--int); fill: var(--int); }
.float { stroke: var(--float); fill: var(--float); } .string { stroke: var(--string); fill: var(--string); }
.any { stroke: var(--any); fill: var(--any); }
path.link { fill: none; }
#status { grid-column: 1 / 4; border-top: 1px solid var(--line); background: var(--panel);
  padding: 6px 12px; display: flex; gap: 16px; flex-wrap: wrap; max-height: 120px; overflow: auto; }
.err { color: var(--err); } .warn { color: var(--warn); } .okc { color: var(--bool); }
label.f { display: block; margin: 6px 0 2px; color: var(--muted); font-size: 12px; }
.hint { color: var(--muted); font-size: 12px; margin: 2px 0 0; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center;
  justify-content: center; z-index: 10; }
#modal.on { display: flex; }
#modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; width: min(900px, 94vw);
  max-height: 86vh; display: flex; flex-direction: column; }
#modal .bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
#modal pre { margin: 0; padding: 12px; overflow: auto; font: 12px/1.45 Consolas, monospace; }
@media (max-width: 900px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto 40vh 1fr auto auto; }
  header, #status { grid-column: 1; }
  #palette { order: 3; max-height: 30vh; } #props { order: 4; max-height: 30vh; }
}
</style>
</head>
<body>
<header>
  <h1 id="title">FLP_next</h1>
  <a href="/designer" style="margin-right:8px">Веб-интерфейс ESP32</a>
  <button id="bCheck">Проверить</button>
  <button id="bGen">Скетч</button>
  <button id="bBuild">Собрать</button>
  <input id="port" placeholder="порт, напр. COM5" style="width:140px">
  <button id="bUp" class="primary">Залить</button>
  <span style="flex:1"></span>
  <button id="bFit">Показать всё</button>
  <span class="hint">Колесо — масштаб, перетаскивание фона — сдвиг, Delete — удалить выбранное</span>
</header>
<aside id="palette">
  <input id="search" placeholder="Поиск блока…">
  <div id="palList"></div>
</aside>
<main>
  <div id="tabs"></div>
  <svg id="canvas"></svg>
</main>
<aside id="props"></aside>
<div id="status"></div>
<div id="modal"><div class="box"><div class="bar"><b id="mTitle"></b><button id="mClose">Закрыть</button></div><pre id="mBody"></pre></div></div>

<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const W = 160, HEAD = 26, ROW = 20, PAD = 8, GRID = 10;
let S = null;                // schema
let TYPES = {};              // block type → description
let sheet = 1;
let sel = null;              // {kind: 'block'|'link', id|to}
let view = { x: 0, y: 0, k: 1 };
let busy = false;

const $ = (id) => document.getElementById(id);
const svg = $("canvas");
const world = document.createElementNS(NS, "g");
svg.appendChild(world);

async function api(name, args = {}) {
  const r = await fetch("/api/" + name, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(args),
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.result;
}

function say(text, cls) {
  const s = $("status");
  const span = document.createElement("span");
  span.className = cls || "";
  span.textContent = text;
  s.prepend(span);
}

// Runs an edit command, then reloads the schema; errors go to the status bar.
async function edit(name, args) {
  try { await api(name, args); } catch (e) { await load(); say("Ошибка: " + e.message, "err"); return false; }
  await load();
  return true;
}

async function load() {
  S = await api("get_schema");
  $("title").textContent = "FLP_next — " + S.project;
  const sheets = new Set(Object.values(S.placement).map((p) => p.sheet));
  sheets.add(1);
  if (!sheets.has(sheet)) sheet = 1;
  renderTabs([...sheets].sort((a, b) => a - b));
  render();
  renderProps();
  renderStatus();
}

async function loadTypes() {
  const list = await api("list_block_types");
  TYPES = {};
  const groups = {};
  for (const t of list) { TYPES[t.type] = t; (groups[t.group] ||= []).push(t); }
  const root = $("palList");
  root.innerHTML = "";
  const q = $("search").value.trim().toLowerCase();
  for (const g of Object.keys(groups).sort((a, b) => a.localeCompare(b, "ru"))) {
    const items = groups[g].filter((t) => !q || (t.type + " " + t.name + " " + t.description).toLowerCase().includes(q));
    if (!items.length) continue;
    const d = document.createElement("details");
    d.open = !!q;
    const s = document.createElement("summary");
    s.textContent = g || "Без группы";
    d.appendChild(s);
    for (const t of items) {
      const b = document.createElement("button");
      b.className = "pal";
      b.textContent = t.name;
      b.title = t.description;
      b.onclick = () => edit("add_block", { type: t.type, sheet });
      d.appendChild(b);
    }
    root.appendChild(d);
  }
}

function renderTabs(list) {
  const t = $("tabs");
  t.innerHTML = "";
  const add = (n) => {
    const b = document.createElement("button");
    const info = (S.sheets || []).find((s) => s.number === n);
    b.textContent = info && info.name ? info.name : "Плата " + n;
    if (n === sheet) b.className = "on";
    b.onclick = () => { sheet = n; render(); };
    t.appendChild(b);
  };
  list.forEach(add);
}

// ---- geometry ----
function blockBox(id) {
  const pos = S.placement[id] || { sheet: 1, x: 40, y: 40 };
  const v = S.view[id] || { inputs: [], outputs: [] };
  const rows = Math.max(v.inputs.length, v.outputs.length, 1);
  return { id, x: pos.x, y: pos.y, sheet: pos.sheet, w: W, h: HEAD + rows * ROW + PAD, v };
}
function portPos(box, side, i) {
  return { x: box.x + (side === "in" ? 0 : box.w), y: box.y + HEAD + i * ROW + ROW / 2 };
}
function findPort(ref, side) {
  const [id, name] = [ref.slice(0, ref.indexOf(".")), ref.slice(ref.indexOf(".") + 1)];
  if (!S.view[id]) return null;
  const box = blockBox(id);
  const list = side === "out" ? box.v.outputs : box.v.inputs;
  const i = list.findIndex((p) => p.name === name);
  if (i < 0) return null;
  return { box, i, port: list[i], ...portPos(box, side, i) };
}

function el(name, attrs = {}, parent) {
  const e = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

function shownParams(b, box) {
  const def = TYPES[b.type];
  if (!def) return "";
  const out = [];
  for (const n of box.v.params || []) {
    const pd = def.params.find((p) => p.name === n);
    if (!pd) continue;
    const val = n in b ? b[n] : pd.default;
    if (val === null || val === undefined || val === "") continue;
    out.push((pd.label || n) + "=" + val);
  }
  return out.join("  ");
}

function render() {
  world.innerHTML = "";
  world.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`);
  const blocks = S.logic.block || [];
  const links = S.logic.link || [];
  const linked = new Set(links.map((l) => l.to));

  // links under blocks
  for (const l of links) {
    const a = findPort(l.from, "out"), b = findPort(l.to, "in");
    if (!a || !b || a.box.sheet !== sheet || b.box.sheet !== sheet) continue;
    const dx = Math.max(40, Math.abs(b.x - a.x) / 2);
    const d = `M${a.x} ${a.y} C${a.x + dx} ${a.y} ${b.x - dx} ${b.y} ${b.x} ${b.y}`;
    const on = sel && sel.kind === "link" && sel.to === l.to;
    const p = el("path", { d, class: "link " + a.port.type + (on ? " sel" : "") }, world);
    p.setAttribute("fill", "none");
    const h = el("path", { d, class: "hit" }, world);
    h.onclick = (ev) => { ev.stopPropagation(); sel = { kind: "link", to: l.to }; render(); renderProps(); };
  }

  for (const b of blocks) {
    const box = blockBox(b.id);
    if (box.sheet !== sheet) continue;
    const g = el("g", { class: "block" + (sel && sel.kind === "block" && sel.id === b.id ? " sel" : "") }, world);
    el("rect", { class: "body", x: box.x, y: box.y, width: box.w, height: box.h, rx: 6 }, g);
    el("rect", { class: "head", x: box.x + 1, y: box.y + 1, width: box.w - 2, height: HEAD - 2, rx: 5 }, g);
    const t = el("text", { class: "title", x: box.x + 8, y: box.y + 12 }, g);
    t.textContent = b.id;
    const def = TYPES[b.type];
    const s2 = el("text", { class: "sub", x: box.x + 8, y: box.y + 22 }, g);
    s2.textContent = def ? def.name : b.type;
    const shown = shownParams(b, box);
    if (shown) {
      const sp = el("text", { class: "shown", x: box.x, y: box.y + box.h + 12 }, g);
      sp.textContent = shown.length > 40 ? shown.slice(0, 39) + "…" : shown;
    }
    box.v.inputs.forEach((p, i) => {
      const q = portPos(box, "in", i);
      const c = el("circle", { class: "port " + p.type, cx: q.x, cy: q.y, r: 5, "data-in": b.id + "." + p.name }, g);
      c.addEventListener("mousedown", (ev) => ev.stopPropagation());
      const lt = el("text", { x: q.x + 9, y: q.y + 4 }, g);
      let label = p.label || p.name;
      const cv = (b.const || {})[p.name];
      if (!linked.has(b.id + "." + p.name) && cv !== undefined) {
        const c2 = el("tspan", { class: "cst" }, lt);
        lt.textContent = label + " = ";
        c2.textContent = String(cv);
        lt.appendChild(c2);
      } else lt.textContent = label;
    });
    box.v.outputs.forEach((p, i) => {
      const q = portPos(box, "out", i);
      const c = el("circle", { class: "port " + p.type, cx: q.x, cy: q.y, r: 5, "data-out": b.id + "." + p.name }, g);
      c.addEventListener("mousedown", (ev) => startLink(ev, b.id + "." + p.name, q));
      const lt = el("text", { x: q.x - 9, y: q.y + 4, "text-anchor": "end" }, g);
      lt.textContent = p.label || p.name;
    });
    g.addEventListener("mousedown", (ev) => startDrag(ev, b.id));
  }
}

// ---- interaction ----
function toWorld(ev) {
  const r = svg.getBoundingClientRect();
  return { x: (ev.clientX - r.left - view.x) / view.k, y: (ev.clientY - r.top - view.y) / view.k };
}

function startDrag(ev, id) {
  if (ev.button !== 0) return;
  ev.stopPropagation();
  sel = { kind: "block", id };
  const start = toWorld(ev);
  const pos = { ...S.placement[id] };
  let moved = false;
  const move = (e) => {
    const p = toWorld(e);
    S.placement[id] = { ...pos, x: pos.x + p.x - start.x, y: pos.y + p.y - start.y };
    moved = true;
    render();
  };
  const up = async () => {
    window.removeEventListener("mousemove", move);
    window.removeEventListener("mouseup", up);
    if (moved) {
      const p = S.placement[id];
      await edit("move_block", { id, x: Math.round(p.x / GRID) * GRID, y: Math.round(p.y / GRID) * GRID });
    } else { render(); }
    renderProps();
  };
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  render();
  renderProps();
}

function startLink(ev, from, q) {
  ev.stopPropagation();
  ev.preventDefault();
  const ghost = el("path", { class: "link any", "stroke-dasharray": "5 4" }, world);
  ghost.setAttribute("fill", "none");
  const move = (e) => {
    const p = toWorld(e);
    const dx = Math.max(40, Math.abs(p.x - q.x) / 2);
    ghost.setAttribute("d", `M${q.x} ${q.y} C${q.x + dx} ${q.y} ${p.x - dx} ${p.y} ${p.x} ${p.y}`);
  };
  const up = async (e) => {
    window.removeEventListener("mousemove", move);
    window.removeEventListener("mouseup", up);
    ghost.remove();
    const t = document.elementFromPoint(e.clientX, e.clientY);
    const to = t && t.getAttribute && t.getAttribute("data-in");
    if (to) await edit("connect", { from, to });
  };
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
}

svg.addEventListener("mousedown", (ev) => {
  if (ev.button !== 0) return;
  sel = null;
  render(); renderProps();
  const sx = ev.clientX, sy = ev.clientY, v0 = { ...view };
  const move = (e) => { view.x = v0.x + e.clientX - sx; view.y = v0.y + e.clientY - sy; world.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`); };
  const up = () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
});
svg.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k = Math.min(3, Math.max(0.2, view.k * (ev.deltaY < 0 ? 1.1 : 1 / 1.1)));
  view.x = mx - ((mx - view.x) / view.k) * k;
  view.y = my - ((my - view.y) / view.k) * k;
  view.k = k;
  world.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`);
}, { passive: false });

window.addEventListener("keydown", async (ev) => {
  if (ev.key !== "Delete" || !sel || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (sel.kind === "block") { const id = sel.id; sel = null; await edit("remove_block", { id }); }
  else if (sel.kind === "link") { const to = sel.to; sel = null; await edit("disconnect", { to }); }
});

function fit() {
  const boxes = (S.logic.block || []).map((b) => blockBox(b.id)).filter((b) => b.sheet === sheet);
  if (!boxes.length) { view = { x: 20, y: 40, k: 1 }; render(); return; }
  const x0 = Math.min(...boxes.map((b) => b.x)), y0 = Math.min(...boxes.map((b) => b.y));
  const x1 = Math.max(...boxes.map((b) => b.x + b.w)), y1 = Math.max(...boxes.map((b) => b.y + b.h));
  const r = svg.getBoundingClientRect();
  const k = Math.max(0.2, Math.min(1.5, (r.width - 60) / (x1 - x0), (r.height - 90) / (y1 - y0)));
  view = { k, x: 30 - x0 * k, y: 50 - y0 * k };
  render();
}

// ---- properties ----
function field(label, node, hint) {
  const wrap = document.createElement("div");
  const l = document.createElement("label");
  l.className = "f";
  l.textContent = label;
  wrap.appendChild(l);
  wrap.appendChild(node);
  if (hint) { const h = document.createElement("div"); h.className = "hint"; h.textContent = hint; wrap.appendChild(h); }
  return wrap;
}

function paramEditor(b, pd) {
  const cur = pd.name in b ? b[pd.name] : null;
  let node;
  if (pd.choices && pd.choices.length) {
    node = document.createElement("select");
    for (const c of pd.choices) {
      const o = document.createElement("option");
      o.value = JSON.stringify(c.value); o.textContent = c.label;
      node.appendChild(o);
    }
    node.value = JSON.stringify(cur !== null ? cur : pd.default);
    node.onchange = () => edit("set_params", { id: b.id, params: { [pd.name]: JSON.parse(node.value) } });
    return node;
  }
  if (pd.kind === "bool") {
    node = document.createElement("input");
    node.type = "checkbox"; node.style.width = "auto";
    node.checked = cur !== null ? !!cur : !!pd.default;
    node.onchange = () => edit("set_params", { id: b.id, params: { [pd.name]: node.checked } });
    return node;
  }
  node = document.createElement("input");
  const numeric = pd.kind === "int" || pd.kind === "float" || pd.kind === "pin";
  if (numeric) { node.type = "number"; node.step = pd.kind === "float" ? "any" : "1"; }
  if (pd.min !== null && pd.min !== undefined) node.min = pd.min;
  if (pd.max !== null && pd.max !== undefined) node.max = pd.max;
  node.value = cur !== null ? cur : "";
  node.placeholder = pd.default !== null && pd.default !== undefined ? String(pd.default) : "обязательный";
  node.onchange = () => {
    let v = node.value.trim();
    if (v === "") v = null; else if (numeric) v = Number(v);
    return edit("set_params", { id: b.id, params: { [pd.name]: v } });
  };
  return node;
}

function constEditor(b, p) {
  const key = b.id + "." + p.name;
  const cur = (b.const || {})[p.name];
  let node;
  if (p.type === "bool") {
    node = document.createElement("select");
    for (const [v, t] of [["", "— (нет)"], ["true", "true"], ["false", "false"]]) {
      const o = document.createElement("option"); o.value = v; o.textContent = t; node.appendChild(o);
    }
    node.value = cur === undefined ? "" : String(cur);
    node.onchange = () => edit("set_input_const", { input: key, value: node.value === "" ? null : node.value === "true" });
  } else {
    node = document.createElement("input");
    const num = p.type === "int" || p.type === "float";
    if (num) { node.type = "number"; node.step = p.type === "float" ? "any" : "1"; }
    node.value = cur === undefined ? "" : cur;
    node.placeholder = p.default !== null && p.default !== undefined ? "по умолч. " + p.default : "нужна связь";
    node.onchange = () => {
      const v = node.value.trim();
      return edit("set_input_const", { input: key, value: v === "" ? null : num ? Number(v) : v });
    };
  }
  return node;
}

function renderProps() {
  const root = $("props");
  root.innerHTML = "";
  if (!sel) {
    root.innerHTML = "<h2>Проект</h2>";
    const p = document.createElement("div");
    p.innerHTML = `<div>Плата: <b>${S.board}</b></div><div class="hint">Выберите блок, чтобы изменить его параметры. Перетащите кружок выхода на кружок входа, чтобы соединить.</div>`;
    root.appendChild(p);
    return;
  }
  if (sel.kind === "link") {
    const l = (S.logic.link || []).find((x) => x.to === sel.to);
    root.innerHTML = "<h2>Связь</h2>";
    if (l) {
      const d = document.createElement("div");
      d.textContent = l.from + " → " + l.to;
      root.appendChild(d);
      const b = document.createElement("button");
      b.textContent = "Удалить связь";
      b.style.marginTop = "10px";
      b.onclick = () => { sel = null; edit("disconnect", { to: l.to }); };
      root.appendChild(b);
    }
    return;
  }
  const b = (S.logic.block || []).find((x) => x.id === sel.id);
  if (!b) { sel = null; return renderProps(); }
  const def = TYPES[b.type];
  const view_ = S.view[b.id] || { inputs: [], outputs: [], params: [] };
  root.innerHTML = `<h2>${def ? def.name : b.type}</h2>`;
  if (def) { const d = document.createElement("div"); d.className = "hint"; d.textContent = def.description; root.appendChild(d); }
  const id = document.createElement("input");
  id.value = b.id;
  id.onchange = async () => { const old = b.id; if (await edit("rename_block", { id: old, new_id: id.value.trim() })) sel = { kind: "block", id: id.value.trim() }; render(); renderProps(); };
  root.appendChild(field("Имя (id)", id));

  if (def && view_.params.length) {
    const h = document.createElement("h2"); h.textContent = "Параметры"; root.appendChild(h);
    for (const n of view_.params) {
      const pd = def.params.find((p) => p.name === n);
      if (pd) root.appendChild(field(pd.label || pd.name, paramEditor(b, pd), pd.description));
    }
  }
  const linked = new Set((S.logic.link || []).map((l) => l.to));
  const free = view_.inputs.filter((p) => !linked.has(b.id + "." + p.name));
  if (free.length) {
    const h = document.createElement("h2"); h.textContent = "Константы на входах"; root.appendChild(h);
    for (const p of free) root.appendChild(field((p.label || p.name) + " (" + p.type + ")", constEditor(b, p)));
  }
  const del = document.createElement("button");
  del.textContent = "Удалить блок";
  del.style.marginTop = "14px";
  del.onclick = () => { const i = b.id; sel = null; edit("remove_block", { id: i }); };
  root.appendChild(del);
}

function renderStatus() {
  const s = $("status");
  s.innerHTML = "";
  const c = S.check;
  if (!c.errors.length && !c.warnings.length) {
    const o = document.createElement("span"); o.className = "okc"; o.textContent = "Проверка: ошибок нет. Порядок: " + c.order.join(" → ");
    s.appendChild(o);
  }
  for (const e of c.errors) { const x = document.createElement("span"); x.className = "err"; x.textContent = "✖ " + e; s.appendChild(x); }
  for (const w of c.warnings) { const x = document.createElement("span"); x.className = "warn"; x.textContent = "⚠ " + w; s.appendChild(x); }
}

// ---- toolbar ----
function modal(title, text) {
  $("mTitle").textContent = title; $("mBody").textContent = text; $("modal").classList.add("on");
}
$("mClose").onclick = () => $("modal").classList.remove("on");
async function longTask(btn, name, args, title) {
  const old = btn.textContent;
  document.querySelectorAll("header button").forEach((b) => (b.disabled = true));
  btn.textContent = "Ждите…";
  try {
    const r = await api(name, args);
    modal(title, r.sketch || r.result || JSON.stringify(r, null, 2));
  } catch (e) { modal(title + " — ошибка", e.message); }
  document.querySelectorAll("header button").forEach((b) => (b.disabled = false));
  btn.textContent = old;
}
$("bCheck").onclick = load;
$("bGen").onclick = (e) => longTask(e.target, "generate", {}, "Скетч Arduino C++");
$("bBuild").onclick = (e) => longTask(e.target, "build", {}, "Сборка");
$("bUp").onclick = (e) => longTask(e.target, "upload", $("port").value.trim() ? { port: $("port").value.trim() } : {}, "Заливка");
$("bFit").onclick = fit;
$("search").oninput = loadTypes;

(async () => {
  try { await loadTypes(); await load(); fit(); }
  catch (e) { say("Не удалось загрузить проект: " + e.message, "err"); }
})();
</script>
