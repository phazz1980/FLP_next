[package]
name = "crab-demo"
version.workspace = true
edition.workspace = true
description = "Browser demo of CrabLogic: view an example, build (check + sketch) and simulate"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
crab-core = { path = "../crab-core" }
crab-codegen = { path = "../crab-codegen" }
crab-sim = { path = "../crab-sim" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlElement", "File", "FileReader", "HtmlInputElement", "FileList", "Event", "EventTarget"] }
js-sys = "0.3"
